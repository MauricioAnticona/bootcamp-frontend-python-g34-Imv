<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS: flebox</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            height: 100vh;
        }
        .contenedor {
            width: 300px;
            height: 300px;
            background-color: lightgoldenrodyellow;
            display: flex;
            flex-direction: row;
            /* flex-direction: column; */
            gap: 5px; 

            /* Alineacion horizontal */
            justify-content: start;
            justify-content: center;
            justify-content: end;
            justify-content: space-between;

            /* Alineacion vertical */
            align-items: start;
            align-items: end;
            align-items: center;



        }

        .box {
            width: 50px;
            height: 50px;
            background-color: coral;
            text-align: center;
            padding: 5px;

        }


        header{
            display: flex;
            flex-direction: row;
            width: 100%;
            justify-content: space-between;
            gap: 10px;
            border: 1px solid red;
        }
        menu {
            display: flex;
            gap: 10px ;
        }

    </style>
</head>
<body>

    <!--
    TDO: el logo y el menu se visulizaran
    horizontalmente usando space between y
    los enlaces dentro de nav tendran un gap de 10px -->

<header>
    <h1>HolaFlexbox</h1>
    <nav class="menu">
        <a href="#inicio">Inicio</a>
        <a href="#cursos">Cursos</a>
        <a href="#contacto">Contacto</a>
    </nav>
</header>

 <div class="contenedor">

        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
        <div class="box">D</div>


    </div> 
</body>
</html>
